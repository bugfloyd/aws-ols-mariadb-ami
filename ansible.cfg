[defaults]
# Pin the remote temp directory to an absolute path. The default is
# "~/.ansible/tmp", and the tilde does not always expand as expected through
# Packer's SSH proxy adapter, which leaves a literal "~<user>" directory behind
# in the remote home and bakes it into the image.
remote_tmp = /tmp/.ansible/tmp

# Provisioning a brand new instance every build, so a stale host key is never
# meaningful here.
host_key_checking = False
