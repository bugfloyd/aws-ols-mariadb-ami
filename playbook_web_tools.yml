- name: Install web tier tooling
  hosts: all
  become: yes
  vars:
    php_version: "83"

  tasks:
    - name: Install shared storage and database client packages
      apt:
        name:
          # The shared file system (FSx for OpenZFS in aws-wp) is mounted with
          # the stock NFS 4.2 client. No vendor mount helper is needed: the file
          # system sits in data subnets locked to the web tier's security group.
          - nfs-common
          # Matches the RDS engine version. The MariaDB client cannot speak
          # MySQL 8.0's default caching_sha2_password authentication.
          - mysql-client-core-8.0
          - unzip
        state: present
        update_cache: yes

    # PHP extensions WordPress relies on, beyond what playbook_webserver.yml
    # installs for both profiles. Web profile only, so the standalone image
    # behind the published post does not change.
    #
    # curl is the one that matters. Without it WordPress's HTTP library falls
    # back to a socket transport that turns SNI off whenever SSL verification is
    # off, which WordPress does for every request to its own site. Behind
    # CloudFront's SNI-only certificates those handshakes fail: Site Health's
    # REST checks, plugins' background job runners and auto-update checks all
    # break. intl and imagick are what Site Health recommends; Imagick is
    # WordPress's preferred image editor.
    - name: Install PHP extensions for WordPress
      apt:
        name:
          - lsphp{{ php_version }}-curl
          - lsphp{{ php_version }}-intl
          - lsphp{{ php_version }}-imagick
        state: present

    - name: Install AWS CLI if not present
      shell: |
        if ! command -v aws &> /dev/null; then
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          rm -rf /tmp/aws /tmp/awscliv2.zip
        fi
      args:
        executable: /bin/bash

    # Systems Manager agent, from the standalone package rather than the snap.
    #
    # Ubuntu ships amazon-ssm-agent as a snap, and playbook_pre purges snapd -
    # deliberately, because snap auto-refresh updates packages on its own
    # schedule, and these instances are meant to change only through a new image
    # and a rolling refresh. The .deb gives Session Manager, Run Command and
    # port forwarding without bringing that back.
    - name: Install the SSM agent
      ansible.builtin.apt:
        deb: "https://s3.{{ aws_region }}.amazonaws.com/amazon-ssm-{{ aws_region }}/latest/debian_amd64/amazon-ssm-agent.deb"
        state: present

    - name: Enable and start the SSM agent
      ansible.builtin.systemd:
        name: amazon-ssm-agent
        enabled: yes
        state: started
